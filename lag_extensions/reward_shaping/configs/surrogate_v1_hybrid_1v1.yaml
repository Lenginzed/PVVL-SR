reward_shaping:
  enabled: true
  semantic_source: "surrogate"
  fallback_semantic_source: "physical"
  use_label_fusion: true
  use_potential_based: true
  gamma: 0.99
  alpha: 0.5
  beta: 1.0
  verification_mode: soft_gate
  consistency_threshold: 0.3
  tau: 0.2
  low_confidence_value: 0.1
  physical_reward_from: weighted_scores
  log_steps: true
  log_episodes: true

surrogate:
  enabled: true
  model_dir: "scripts/results/surrogate_models/stage8_surrogate_v1"
  model_path: null
  input_dim: auto
  output_dim: 8
  hidden_dim: 128
  num_layers: 3
  dropout: 0.0
  target_type: "fused_scores"
  output_mode: "fused_scores_direct"
  normalize_features: true
  device: "cpu"

label_fusion:
  override_threshold: 0.6
  low_physical_threshold: 0.1
  high_physical_threshold: 0.8
  low_vlm_threshold: 0.2
  high_vlm_threshold: 0.8
  labels:
    ego_tail_advantage:
      policy: "hybrid"
      lambda_vlm: 0.7
      physical_override: true
    enemy_tail_threat:
      policy: "hybrid"
      lambda_vlm: 0.7
      physical_override: true
    effective_attack_window:
      policy: "hybrid"
      lambda_vlm: 0.6
      physical_override: true
    enemy_missile_threat_zone:
      policy: "hybrid"
      lambda_vlm: 0.4
      physical_override: true
    energy_advantage:
      policy: "physical"
      lambda_vlm: 0.0
      physical_override: true
    energy_disadvantage:
      policy: "physical"
      lambda_vlm: 0.0
      physical_override: true
    defensive_escape:
      policy: "hybrid"
      lambda_vlm: 0.5
      physical_override: true
    neutral_stalemate:
      policy: "hybrid"
      lambda_vlm: 0.5
      physical_override: true

curriculum:
  enabled: true
  mode: by_training_steps
  stages:
    - name: advantage_or_basic
      start_step: 0
      beta: 1.0
      alpha: 0.5
      semantic_source: surrogate
      semantic_call_interval: 1
      opponent_level: weak
      situation_level: easy
    - name: balanced
      start_step: 100000
      beta: 0.6
      alpha: 0.8
      semantic_source: surrogate
      semantic_call_interval: 1
      opponent_level: medium
      situation_level: neutral
    - name: adversarial
      start_step: 300000
      beta: 0.3
      alpha: 0.5
      semantic_source: surrogate
      semantic_call_interval: 1
      opponent_level: historical_or_strong
      situation_level: hard
    - name: final
      start_step: 600000
      beta: 0.0
      alpha: 0.2
      semantic_source: surrogate
      semantic_call_interval: 1
      opponent_level: strong
      situation_level: random
